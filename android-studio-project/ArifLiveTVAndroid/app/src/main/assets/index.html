<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arif Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a12;color:#eee;font:14px system-ui}header{padding:18px;display:flex;justify-content:space-between;align-items:center;background:#131421;border-bottom:1px solid #282a3d}h1{font-size:20px;margin:0;color:#ad8bff;display:flex;align-items:center;gap:9px}.app-logo{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,#8355f6,#5425b8);color:#fff;font-size:15px;font-weight:900;box-shadow:0 0 18px #6c3bc844;border:1px solid #b79aff}button,input{font:inherit;color:inherit;border:1px solid #34364a;background:#1b1c2b;padding:10px;border-radius:9px}button{cursor:pointer}main{display:grid;grid-template-columns:280px 1fr;gap:15px;padding:15px}aside,section{background:#141522;border:1px solid #282a3d;border-radius:14px;padding:14px}#list{max-height:70vh;overflow:auto}.channel{padding:12px;border-bottom:1px solid #27283a;cursor:pointer}.channel:hover{background:#24203a}.player{background:#05060c;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden}video{width:100%;height:100%;display:none}.playing video{display:block}.playing .placeholder{display:none}.placeholder{color:#ad8bff;text-align:center}.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}input[type=search]{width:100%;margin-bottom:8px}@media(max-width:700px){main{grid-template-columns:1fr}#list{max-height:35vh}}
</style></head><body>
<header><h1><span class="app-logo">AR</span> ARIF LIVE TV</h1><div><button id="open">Open M3U</button> <button id="add">Add URL</button></div></header>
<main><aside><input id="search" type="search" placeholder="Search channels..."><div id="list">No channels loaded. Open an M3U playlist or add a stream URL.</div><input id="file" type="file" accept=".m3u,.m3u8,.txt" hidden></aside>
<section><div class="player" id="screen"><video id="video" controls playsinline></video><div class="placeholder">▮▮▮<p>Select a channel to play</p></div></div><p id="now">Nothing playing</p><div class="controls"><button id="play">Play</button><button id="stop">Stop</button><button id="full">Fullscreen</button></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id),v=$('video'),screen=$('screen');let channels=[],hls=null,selected=null;
function draw(){let q=$('search').value.toLowerCase(),items=channels.filter(c=>c.name.toLowerCase().includes(q));$('list').innerHTML=items.length?items.map(c=>'<div class="channel" data-i="'+channels.indexOf(c)+'">'+c.name+'</div>').join(''):'<p>No channels found</p>';document.querySelectorAll('.channel').forEach(el=>el.onclick=()=>playChannel(channels[+el.dataset.i]));}
function playChannel(c){selected=c;$('now').textContent='Now playing: '+c.name;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();screen.classList.remove('playing');if(window.Hls&&Hls.isSupported()&&c.url.includes('.m3u8')){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));}else{v.src=c.url;v.play().catch(()=>{});}v.onplaying=()=>screen.classList.add('playing');}
function parse(text){let name='Channel';channels=[];for(let line of text.split(/\r?\n/)){line=line.trim();if(line.startsWith('#EXTINF'))name=line.split(',').pop().trim()||'Channel';else if(line&&!line.startsWith('#'))channels.push({name,url:line});}draw();}
$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(f)parse(await f.text());};$('add').onclick=()=>{let name=prompt('Channel name?');if(!name)return;let url=prompt('Stream URL?');if(url){channels.unshift({name,url});draw();}};$('search').oninput=draw;$('play').onclick=()=>selected&&v.play();$('stop').onclick=()=>{v.pause();v.currentTime=0};$('full').onclick=()=>screen.requestFullscreen?.();})();
</script></body></html>
