<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arif Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a12;color:#eee;font:14px system-ui}header{padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#131421;border-bottom:1px solid #282a3d}h1{font-size:20px;margin:0;color:#ad8bff;display:flex;align-items:center;gap:9px}.app-logo{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,#8355f6,#5425b8);color:#fff;font-size:15px;font-weight:900;box-shadow:0 0 18px #6c3bc844;border:1px solid #b79aff}button,input{font:inherit;color:inherit;border:1px solid #34364a;background:#1b1c2b;padding:10px;border-radius:9px}button{cursor:pointer}button:hover{border-color:#9573fa;background:#24233a}main{display:grid;grid-template-columns:300px 1fr;gap:15px;padding:15px}aside,section{background:#141522;border:1px solid #282a3d;border-radius:14px;padding:14px}#list{max-height:54vh;overflow:auto}.channel{padding:11px;border-bottom:1px solid #27283a;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}.channel:hover{background:#24203a}.channel .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.smallbtn{padding:4px 8px;color:#ffb7c2;border-color:#633544}.player{background:#05060c;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden}video{width:100%;height:100%;display:none}.playing video{display:block}.playing .placeholder{display:none}.placeholder{color:#ad8bff;text-align:center}.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}input[type=search]{width:100%;margin-bottom:8px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:10px 0 5px;font-weight:700;color:#bca7ff}.saved{display:flex;gap:5px;align-items:center;margin:6px 0}.saved select{flex:1;min-width:0;background:#1b1c2b;color:#fff;border:1px solid #34364a;border-radius:8px;padding:9px}.empty{color:#999;padding:10px}@media(max-width:700px){main{grid-template-columns:1fr}#list{max-height:38vh}}
</style></head><body>
<header><h1><span class="app-logo">AR</span> ARIF LIVE TV</h1><div><button id="open">Open M3U</button> <button id="add">Add URL</button></div></header>
<main><aside>
<div class="section-title">Saved Playlists <button id="delPlaylist" class="smallbtn" title="Delete selected playlist">Delete</button></div>
<div class="saved"><select id="playlistSelect" aria-label="Saved playlists"></select></div>
<input id="search" type="search" placeholder="Search channels...">
<div id="list">No saved channels. Open an M3U or add a stream URL.</div><input id="file" type="file" accept=".m3u,.m3u8,.txt" hidden>
</aside>
<section><div class="player" id="screen"><video id="video" controls playsinline></video><div class="placeholder">▮▮▮<p>Select a channel to play</p></div></div><p id="now">Nothing playing</p><div class="controls"><button id="play">Play</button><button id="stop">Stop</button><button id="full">Fullscreen</button></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id),v=$('video'),screen=$('screen');let channels=[],hls=null,selected=null,activeId=null;
const STORAGE='arifLiveTvSavedSourcesV1';
function readSaved(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(e){return []}}
function saveSaved(data){localStorage.setItem(STORAGE,JSON.stringify(data))}
function safeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function renderSaved(){let sources=readSaved(),sel=$('playlistSelect');sel.innerHTML='';if(!sources.length){sel.innerHTML='<option value="">No saved playlists</option>';channels=[];draw();return}
sources.forEach(s=>{let o=document.createElement('option');o.value=s.id;o.textContent=s.name;sel.appendChild(o)});if(!sources.some(s=>s.id===activeId))activeId=sources[0].id;sel.value=activeId;loadSource(activeId)}
function loadSource(id){let src=readSaved().find(s=>s.id===id);if(!src)return;activeId=id;channels=src.channels||[];selected=null;$('now').textContent='Playlist: '+src.name;draw()}
function draw(){let q=$('search').value.toLowerCase(),items=channels.filter(c=>c.name.toLowerCase().includes(q));$('list').innerHTML=items.length?items.map(c=>'<div class="channel" data-i="'+channels.indexOf(c)+'"><span class="name">'+escapeHTML(c.name)+'</span><button class="smallbtn removeChannel" data-i="'+channels.indexOf(c)+'" title="Remove saved channel">×</button></div>').join():'<div class="empty">No channels in this playlist.</div>';document.querySelectorAll('.channel .name').forEach(el=>el.onclick=()=>playChannel(channels[+el.parentElement.dataset.i]));document.querySelectorAll('.removeChannel').forEach(btn=>btn.onclick=e=>{e.stopPropagation();let i=+btn.dataset.i;if(!confirm('Remove this channel from saved playlist?'))return;channels.splice(i,1);persistCurrent();draw()}})}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persistCurrent(){let saved=readSaved(),idx=saved.findIndex(s=>s.id===activeId);if(idx>=0){saved[idx].channels=channels;saveSaved(saved)}}
function playChannel(c){selected=c;$('now').textContent='Now playing: '+c.name;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();screen.classList.remove('playing');if(window.Hls&&Hls.isSupported()&&c.url.toLowerCase().includes('.m3u8')){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));}else{v.src=c.url;v.play().catch(()=>{});}v.onplaying=()=>screen.classList.add('playing')}
function parse(text){let name='Channel',parsed=[];for(let line of text.split(/\r?\n/)){line=line.trim();if(line.startsWith('#EXTINF'))name=line.split(',').pop().trim()||'Channel';else if(line&&!line.startsWith('#')){parsed.push({name,url:line});name='Channel'}}return parsed}
function saveSource(name,items){let saved=readSaved(),id=safeId();saved.unshift({id,name,channels:items});saveSaved(saved);activeId=id;renderSaved();$('playlistSelect').value=id}
$('open').onclick=()=>$('file').click();
$('file').onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let parsed=parse(String(reader.result||''));if(!parsed.length){alert('M3U file-e kono channel paoa jayni.');e.target.value='';return;}let label=prompt('Playlist name:',f.name.replace(/\\.(m3u8?|txt)$/i,''))||f.name;saveSource(label,parsed);alert(parsed.length+' ta channel save hoyeche.');e.target.value='';};reader.onerror=()=>{alert('File read korte parini. Abar try korun.');e.target.value='';};reader.readAsText(f);};
$('add').onclick=()=>{let name=prompt('Channel name?');if(!name||!name.trim())return;let url=prompt('Stream URL (http:// or https://)');if(!url||!url.trim())return;url=url.trim();try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw new Error('bad');}catch(e){alert('Valid http/https stream link din.');return;}let saved=readSaved();if(!activeId||!saved.some(s=>s.id===activeId)){saveSource('My URLs',[{name:name.trim(),url}]);alert('URL channel save hoyeche.');return;}channels.unshift({name:name.trim(),url});persistCurrent();draw();alert('Channel saved!');};
$('delPlaylist').onclick=()=>{if(!activeId)return;let saved=readSaved(),src=saved.find(s=>s.id===activeId);if(!src||!confirm('Delete saved playlist "'+src.name+'" permanently?'))return;saved=saved.filter(s=>s.id!==activeId);saveSaved(saved);activeId=saved[0]?.id||null;renderSaved()};
$('playlistSelect').onchange=e=>loadSource(e.target.value);$('search').oninput=draw;$('play').onclick=()=>selected&&v.play();$('stop').onclick=()=>{v.pause();v.currentTime=0};$('full').onclick=()=>{if(screen.requestFullscreen)screen.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};renderSaved();
})();
</script></body></html>
